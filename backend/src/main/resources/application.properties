spring.application.name=rental
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=50
homely.payment.mock-enabled=${MOCK_PAYMENT_ENABLED:false}
homely.payment.mock-webhook-secret=${MOCK_WEBHOOK_SECRET:}
homely.demo.enabled=${DEMO_ENABLED:false}
homely.demo.seed=${DEMO_SEED:false}
homely.demo.password=${DEMO_PASSWORD:}
homely.fcm.enabled=${FCM_ENABLED:false}
homely.fcm.project-id=${FIREBASE_PROJECT_ID:}

# Database
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:rental_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT
homely.jwt.base64-secret=${JWT_SECRET:}
homely.jwt.access-token-validity-in-seconds=${JWT_ACCESS_TTL_SECONDS:900}
homely.jwt.refresh-token-validity-in-seconds=604800

# API prefix
apiPrefix=api/v1

# Server
server.port=${SERVER_PORT:8080}

# Cookie
homely.cookie.secure=false
homely.cookie.same-site=Lax

# File upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=60MB

# Actuator
management.endpoints.web.exposure.include=health,info

# MinIO (S3)
homely.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
homely.minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
homely.minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
homely.minio.bucket=${MINIO_BUCKET:homely-media}
homely.minio.presigned-url-expiry-seconds=3600

# Scheduling
spring.task.scheduling.pool.size=4

# SMTP: local Mailpit by default; override for deployment.
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
homely.mail.from=${MAIL_FROM:noreply@homely.local}
