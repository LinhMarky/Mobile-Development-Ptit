spring.application.name=roomly-student14
server.port=${STUDENT14_HTTP_PORT:18092}
server.address=${STUDENT14_BIND_ADDRESS:127.0.0.1}
spring.datasource.url=jdbc:mysql://${STUDENT14_DB_HOST:127.0.0.1}:${STUDENT14_DB_PORT:3306}/${STUDENT14_DATABASE:homely_student14}?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&sslMode=${STUDENT14_DB_SSL_MODE:DISABLED}
spring.datasource.username=${STUDENT14_DB_USER:homely_student14}
spring.datasource.password=${STUDENT14_DB_PASSWORD}
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration,org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
spring.flyway.enabled=false
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.accept-float-as-int=false
management.health.mail.enabled=false
management.endpoints.web.exposure.include=health,info
student14.jwt-secret=${STUDENT14_JWT_SECRET}
student14.media-directory=${STUDENT14_MEDIA_DIRECTORY:./Infra/student14/.local/media}
student14.mock-payment-enabled=${STUDENT14_MOCK_PAYMENT_ENABLED:true}
student14.mock-mail-enabled=${STUDENT14_MOCK_MAIL_ENABLED:true}
student14.mail-enabled=${STUDENT14_MAIL_ENABLED:false}
student14.push-enabled=${STUDENT14_PUSH_ENABLED:false}
student14.firebase-project-id=${STUDENT14_FIREBASE_PROJECT_ID:}
student14.firebase-credentials=${STUDENT14_FIREBASE_CREDENTIALS:}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL:false}
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.auth.mechanisms=LOGIN
