# Supply environment variables explicitly when activating SPRING_PROFILES_ACTIVE=prod.
spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DB}?sslMode=VERIFY_IDENTITY&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
homely.minio.endpoint=${MINIO_ENDPOINT}
homely.minio.access-key=${MINIO_ACCESS_KEY}
homely.minio.secret-key=${MINIO_SECRET_KEY}
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
homely.mail.from=${MAIL_FROM}
homely.cookie.secure=true
management.endpoint.health.show-details=when_authorized
management.endpoint.health.roles=ADMIN
management.endpoints.web.exposure.include=health,info,metrics
