openapi: 3.0.1
info:
  title: Homely API
  description: HTTP JSON dùng {statusCode,message,data}; DTO trong data dùng snake_case, VND là chuỗi số nguyên. Thanh toán và hoàn tiền là sandbox.
  version: 1.6.0
servers:
- description: Local backend; paths include /api/v1
  url: http://localhost:8080
paths:
  /api/v1/profile/device-token:
    put:
      tags:
      - profile-controller
      summary: Register or update device token
      operationId: registerDeviceToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceTokenRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                required:
                - statusCode
                - message
                - data
                type: object
                properties:
                  statusCode:
                    type: integer
                    format: int32
                    example: 200
                  message:
                    type: string
                  data:
                    type: object
                    additionalProperties:
                      type: string
        default:
          description: HTTP status giữ nguyên; data chứa ProblemDTO với code, field_errors và trace_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestResponseProblemDTO'
      security:
      - bearerAuth: [
          ]
  /api/v1/listings/{id}/fees:
    get:
      tags:
      - listing-controller
      summary: Get listing fees
      operationId: getFees
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                required:
                - statusCode
                - message
                - data
                type: object
                properties:
                  statusCode:
                    type: integer
                    format: int32
                    example: 200
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FeeDTO'
        default:
          description: HTTP status giữ nguyên; data chứa ProblemDTO với code, field_errors và trace_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestResponseProblemDTO'
    put:
      tags:
      - listing-controller
      summary: Set listing fees
      operationId: setFees
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/FeeInput'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                required:
                - statusCode
                - message
                - data
                type: object
                properties:
                  statusCode:
                    type: integer
                    format: int32
                    example: 200
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FeeDTO'
        default:
          description: HTTP status giữ nguyên; data chứa ProblemDTO với code, field_errors và trace_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestResponseProblemDTO'
      security:
      - bearerAuth: [
          ]
  /api/v1/wishlist/{roomId}:
    post:
      tags:
      - wishlist-controller
      summary: Save room to wishlist
      operationId: saveRoom
      parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: Idempotency-Key
        in: header
        description: Giữ nguyên khi retry cùng thao tác; cùng khóa nhưng payload khác trả 409.
        required: true
        schema:
          maxLength: 128
          minLength: 1
          type: string
