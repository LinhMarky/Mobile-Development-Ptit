          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestResponseProblemDTO'
      security:
      - bearerAuth: [
          ]
  /webhooks/payments/mock:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookPayload'
        required: true
      operationId: handleMockWebhook
      summary: Signed sandbox webhook (only when MOCK_PAYMENT_ENABLED=true)
      responses:
        default:
          description: Wrapped error; data contains ProblemDTO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestResponseProblemDTO'
        '200':
          description: Processed or exact duplicate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestResponseVoid'
      parameters:
      - description: Hex HMAC-SHA256 over the exact request bytes, using MOCK_WEBHOOK_SECRET
        schema:
          type: string
        required: true
        in: header
        name: X-Mock-Signature
