          type: string
        failure_code:
          type: string
          maxLength: 100
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
x-stomp:
  endpoint: /ws
  transport: Native WebSocket (no SockJS)
  authentication: Access JWT in HTTP Authorization Bearer header at handshake; no query token or STOMP credentials
  send:
    /app/chat.send:
      schema:
        $ref: '#/components/schemas/MessageSendFrame'
  subscribe:
    /user/queue/chat.messages:
      description: Committed messages for either conversation member; reconnect uses REST history to recover missed events
      schema:
        $ref: '#/components/schemas/ChatMessageDTO'
    /user/queue/chat.acks:
      description: Persisted message for the sending session; exact retries return the existing message without a new event
      schema:
        $ref: '#/components/schemas/ChatMessageDTO'
    /user/queue/chat.errors:
      description: Domain or validation error; no guaranteed client_message_id correlation
      schema:
        $ref: '#/components/schemas/ChatProblem'
  protocol-error:
    description: STOMP ERROR may close the connection for invalid destinations, commands or authentication
    schema:
      $ref: '#/components/schemas/ChatProblem'
  limits:
    frame-bytes: 32768
    messages-per-minute-per-user: 60
  deployment: Single backend instance; in-process broker, REST resync and client deduplication required
