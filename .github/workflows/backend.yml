name: Backend verification

on:
  push:
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: homely_ci
          MYSQL_ROOT_PASSWORD: isolated-ci-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      HOMELY_TEST_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/homely_ci?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      HOMELY_TEST_MYSQL_USER: root
      HOMELY_TEST_MYSQL_PASSWORD: isolated-ci-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify H2 and real MySQL workflows
        run: mvn -B -ntp verify
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          retention-days: 7
